<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Form</title>
    <style>
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--vscode-input-border);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 3px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .primary-button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }
        .secondary-button {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }
        .form-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 1px solid var(--vscode-panel-border);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title" id="form-title">Create Task</h2>
        <form id="task-form">
            <input type="hidden" id="task-id" name="id" value="">
            
            <div class="form-group">
                <label for="task-name">Task Name:</label>
                <input type="text" id="task-name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="task-description">Description:</label>
                <textarea id="task-description" name="description"></textarea>
            </div>
            
            <div class="form-group">
                <label for="task-status">Status:</label>
                <select id="task-status" name="status">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="task-priority">Priority:</label>
                <select id="task-priority" name="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="task-project">Associated Project:</label>
                <select id="task-project" name="project">
                    <option value="">-- Select Project --</option>
                    <!-- Projects will be populated by the extension -->
                </select>
            </div>
            
            <div class="button-group">
                <button type="button" class="secondary-button" id="cancel-button">Cancel</button>
                <button type="submit" class="primary-button" id="save-button">Save</button>
            </div>
        </form>
    </div>

    <script>
        (function() {
            // Get VS Code API
            const vscode = acquireVsCodeApi();
            
            // Get form elements
            const form = document.getElementById('task-form');
            const formTitle = document.getElementById('form-title');
            const idInput = document.getElementById('task-id');
            const nameInput = document.getElementById('task-name');
            const descriptionInput = document.getElementById('task-description');
            const statusInput = document.getElementById('task-status');
            const priorityInput = document.getElementById('task-priority');
            const projectSelect = document.getElementById('task-project');
            const cancelButton = document.getElementById('cancel-button');
            
            // Handle messages from extension
            window.addEventListener('message', event => {
                const message = event.data;
                
                // Handle edit mode
                if (message.type === 'edit') {
                    formTitle.textContent = 'Edit Task';
                    idInput.value = message.task.id;
                    nameInput.value = message.task.name;
                    descriptionInput.value = message.task.description || '';
                    statusInput.value = message.task.status || 'Pending';
                    priorityInput.value = message.task.priority || 'Medium';
                    
                    // Set selected project if available
                    if (message.task.projectId) {
                        projectSelect.value = message.task.projectId;
                    }
                }
                
                // Populate projects dropdown
                if (message.projects) {
                    // Clear existing options except the first one
                    while (projectSelect.options.length > 1) {
                        projectSelect.remove(1);
                    }
                    
                    // Add project options
                    message.projects.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.id;
                        option.textContent = project.name;
                        projectSelect.appendChild(option);
                    });
                }
            });
            
            // Handle form submission
            form.addEventListener('submit', e => {
                e.preventDefault();
                
                const task = {
                    id: idInput.value,
                    name: nameInput.value,
                    description: descriptionInput.value,
                    status: statusInput.value,
                    priority: priorityInput.value,
                    projectId: projectSelect.value
                };
                
                // Send data back to extension
                vscode.postMessage({
                    type: 'save',
                    task: task
                });
            });
            
            // Handle cancel button
            cancelButton.addEventListener('click', () => {
                vscode.postMessage({ type: 'cancel' });
            });
        })();
    </script>
</body>
</html>
