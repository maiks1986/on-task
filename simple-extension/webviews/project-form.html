<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form</title>
    <style>
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--vscode-input-border);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 3px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .primary-button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }
        .secondary-button {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }
        .form-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 1px solid var(--vscode-panel-border);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title" id="form-title">Create Project</h2>
        <form id="project-form">
            <input type="hidden" id="project-id" name="id" value="">
            
            <div class="form-group">
                <label for="project-name">Project Name:</label>
                <input type="text" id="project-name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="project-description">Description:</label>
                <textarea id="project-description" name="description"></textarea>
            </div>
            
            <div class="form-group">
                <label for="project-status">Status:</label>
                <select id="project-status" name="status">
                    <option value="Active">Active</option>
                    <option value="Completed">Completed</option>
                    <option value="On Hold">On Hold</option>
                </select>
            </div>
            
            <div class="button-group">
                <button type="button" class="secondary-button" id="cancel-button">Cancel</button>
                <button type="submit" class="primary-button" id="save-button">Save</button>
            </div>
        </form>
    </div>

    <script>
        (function() {
            // Get VS Code API
            const vscode = acquireVsCodeApi();
            
            // Get form elements
            const form = document.getElementById('project-form');
            const formTitle = document.getElementById('form-title');
            const idInput = document.getElementById('project-id');
            const nameInput = document.getElementById('project-name');
            const descriptionInput = document.getElementById('project-description');
            const statusInput = document.getElementById('project-status');
            const cancelButton = document.getElementById('cancel-button');
            
            // Handle messages from extension
            window.addEventListener('message', event => {
                const message = event.data;
                
                // Handle edit mode
                if (message.type === 'edit') {
                    formTitle.textContent = 'Edit Project';
                    idInput.value = message.project.id;
                    nameInput.value = message.project.name;
                    descriptionInput.value = message.project.description || '';
                    statusInput.value = message.project.status || 'Active';
                }
            });
            
            // Handle form submission
            form.addEventListener('submit', e => {
                e.preventDefault();
                
                const project = {
                    id: idInput.value,
                    name: nameInput.value,
                    description: descriptionInput.value,
                    status: statusInput.value
                };
                
                // Send data back to extension
                vscode.postMessage({
                    type: 'save',
                    project: project
                });
            });
            
            // Handle cancel button
            cancelButton.addEventListener('click', () => {
                vscode.postMessage({ type: 'cancel' });
            });
        })();
    </script>
</body>
</html>
